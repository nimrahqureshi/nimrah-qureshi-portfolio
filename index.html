    <!-- Pre-hydration splash (removed automatically when the app mounts) -->
    <style>
      html { background: #050505; }
      #root:empty + #nq-splash { opacity: 1; visibility: visible; }
      #nq-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        background: #050505;
        opacity: 0; visibility: hidden;
        transition: opacity 0.45s ease, visibility 0.45s ease;
        pointer-events: none;
      }
      #nq-splash .nq-mark {
        font-family: Inter, system-ui, sans-serif;
        font-size: 13px; font-weight: 500;
        letter-spacing: 0.42em; text-indent: 0.42em;
        text-transform: uppercase; color: #E1E0CC;
        animation: nq-breathe 2.2s ease-in-out infinite;
      }
      #nq-splash .nq-bar {
        width: 148px; height: 1px; overflow: hidden;
        background: rgba(225, 224, 204, 0.14); border-radius: 999px;
      }
      #nq-splash .nq-bar::before {
        content: ""; display: block; height: 100%; width: 40%;
        background: linear-gradient(90deg, transparent, #E1E0CC, transparent);
        animation: nq-sweep 1.4s ease-in-out infinite;
      }
      @keyframes nq-sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
      @keyframes nq-breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #nq-splash .nq-mark, #nq-splash .nq-bar::before { animation: none; }
      }
    </style>
  </head>
